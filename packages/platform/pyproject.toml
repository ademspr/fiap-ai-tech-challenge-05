[project]
name = "hackathon-platform"
version = "0.1.0"
description = "Cross-service utilities (shared structlog setup)"
requires-python = ">=3.12"
dependencies = ["structlog>=24.4", "minio>=7.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
