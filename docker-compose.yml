services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: api_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d api_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - ./minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      edge:
      internal:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    volumes:
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - internal
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 8

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8081:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/api_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-change-me}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: hackathon
      MINIO_USE_SSL: "false"
      MIN_TOKENS_ESTIMATE: "10"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INTERNAL_API_BASE: http://traefik:8081
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-change-me}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: hackathon
      MINIO_USE_SSL: "false"
      METRICS_PORT: "9100"
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      CLOUD_MODEL: ${CLOUD_MODEL:-}
      AI_TIMEOUT_SECONDS: "3000"
      AI_MAX_RETRIES: "2"
    networks:
      - internal
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      traefik:
        condition: service_started
      minio:
        condition: service_started
      # ollama-pull:
      #   condition: service_completed_successfully

  # ollama:
  #   image: ollama/ollama:latest
  #   volumes:
  #     - /usr/share/ollama/.ollama:/root/.ollama
  #   networks:
  #     - internal
