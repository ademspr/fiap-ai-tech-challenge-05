name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/platform"
          pip install -e "./packages/contracts[dev]"
          pip install -e "./services/api[dev]"
          pip install -e "./services/worker[dev]"

      - name: Ruff
        run: pip install ruff && ruff check packages/platform/src packages/contracts/tests services/api/src services/api/tests services/worker/src services/worker/tests

      - name: Layer boundaries
        run: bash scripts/check_layer_boundaries.sh

      - name: Pytest
        env:
          PYTHONPATH: services/api/src:services/worker/src
        run: pytest services/api/tests packages/contracts/tests services/worker/tests -v

      - name: Docker Compose build
        run: docker-compose build api worker

  compose-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Full stack + Loki integration
        run: bash scripts/integration_compose_observability.sh
