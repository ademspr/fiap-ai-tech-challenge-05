[project]
name = "hackathon-api"
version = "0.1.0"
description = "FIAP Secure Systems MVP API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "aio-pika>=9.4",
    "prometheus-client>=0.21",
    "hackathon-contracts",
    "hackathon-platform",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.8",
]

[tool.uv.sources]
hackathon-contracts = { path = "../../packages/contracts", editable = true }
hackathon-platform = { path = "../../packages/platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/test_jobs_application.py" = ["E402"]
