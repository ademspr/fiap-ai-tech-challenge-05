[project]
name = "hackathon-worker"
version = "0.1.0"
description = "Diagram analysis worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openlit>=1.33",
    "aio-pika>=9.4",
    "Pillow>=11.0",
    "httpx>=0.28",
    "openai>=1.55",
    "pypdfium2>=4.30",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "hackathon-contracts",
    "hackathon-platform",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv.sources]
hackathon-contracts = { path = "../../packages/contracts", editable = true }
hackathon-platform = { path = "../../packages/platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
