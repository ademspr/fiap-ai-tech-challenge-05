global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  # Per-object metrics: default /metrics agrega filas sem label queue (painéis por fila ficam vazios).
  - job_name: rabbitmq
    scrape_interval: 30s
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
