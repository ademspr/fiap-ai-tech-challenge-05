global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  # Per-object metrics: default /metrics aggregates queues without a queue label (per-queue panels stay empty).
  - job_name: rabbitmq
    scrape_interval: 30s
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: minio
    scrape_interval: 30s
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ["minio:9000"]

  # Bucket gauges/counters populate reliably on single-node; cluster capacity gauges may be absent in some setups.
  - job_name: minio-bucket
    scrape_interval: 30s
    metrics_path: /minio/v2/metrics/bucket
    scheme: http
    static_configs:
      - targets: ["minio:9000"]
